name: Node.js CI

on:
  push:
    branches: [ "dev", "feature/**" ]
  pull_request:
    branches: [ "dev", "feature/**" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Debug
        run: ls -la

      - name: Install deps
        run: npm ci
        working-directory: ./frontend/

      - name: Build
        run: npm run build --if-present
        working-directory: ./frontend/

      - name: Test
        run: npm test
        working-directory: ./frontend/

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci
        working-directory: ./backend/

      - name: Build
        run: npm run build --if-present
        working-directory: ./backend/

      - name: Test
        run: npm test
        working-directory: ./backend/
